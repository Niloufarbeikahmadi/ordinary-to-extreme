# Conda environment for Anaconda / Spyder users.
#   conda env create -f environment.yml
#   conda activate rainfall-extremes
#   pip install -e .
name: rainfall-extremes
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy>=1.26
  - pandas>=2.2
  - scipy>=1.11
  - matplotlib>=3.8
  - pytest>=8.0
  - spyder-kernels
  - pip
